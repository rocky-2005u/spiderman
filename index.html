<!DOCTYPE html>
<html>
<head>
  <title>Spider-Man</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: white;
      min-height: 100%;
    }

    /* =========================
       BACKGROUND VIDEO
    ========================== */

    .background-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;

      /* Make video brighter */
      filter: brightness(1.1);
    }

    /* =========================
       VIDEO OVERLAY
    ========================== */

    .video-overlay {
      position: fixed;
      inset: 0;

      /* Lighter overlay */
      background: rgba(0, 0, 0, 0.20);

      z-index: -1;
    }

    /* =========================
       MAIN CONTENT
    ========================== */

    .content {
      position: relative;
      z-index: 1;
      padding: 30px 20px;
    }

    /* =========================
       TITLE
    ========================== */

    h1 {
      text-align: center;
      margin-bottom: 15px;
      color: #e62429;
      font-size: 42px;
      text-shadow: 0 3px 10px black;
    }

    .description {
      text-align: center;
      margin-bottom: 40px;
      font-size: 18px;
      text-shadow: 0 2px 5px black;
    }

    /* =========================
       MOVIE GALLERY
    ========================== */

    .gallery {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(180px, 1fr)
      );

      gap: 20px;

      max-width: 1200px;
      margin: auto;
    }

    /* =========================
       MOVIE CARD
    ========================== */

    .movie {
      background: rgba(20, 20, 20, 0.75);

      border-radius: 10px;

      overflow: hidden;

      text-align: center;

      box-shadow:
        0 0 15px rgba(0, 0, 0, 0.7);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .movie:hover {
      transform: translateY(-8px);

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.8);
    }

    /* =========================
       MOVIE POSTER
    ========================== */

    .movie img {
      width: 100%;
      height: 270px;

      object-fit: cover;

      display: block;
    }

    /* =========================
       MOVIE TITLE
    ========================== */

    .movie h2 {
      font-size: 16px;

      padding: 10px;

      margin: 0;
    }

    .movie a {
      color: white;

      text-decoration: none;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      h1 {
        font-size: 32px;
      }

      .gallery {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 12px;
      }

      .movie img {
        height: 220px;
      }

      .movie h2 {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
